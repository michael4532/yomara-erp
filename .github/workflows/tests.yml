name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, gd, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      # .env minimal : les tests prennent leurs réglages dans phpunit.xml
      - run: printf 'APP_NAME="Yomara ERP"\nAPP_KEY=\nMAIL_FROM_ADDRESS=ci@example.com\n' > .env && php artisan key:generate
      - run: php artisan test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
