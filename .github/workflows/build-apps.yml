# Yomara ERP — compilation des logiciels Windows, macOS et Linux à chaque version (tag « v0.99.8 »)
# ou à la demande (onglet Actions › Build Yomara ERP › Run workflow).
#
# Copyright © 2026 Yomara Technologies — licence AGPL-3.0 (voir LICENSE et NOTICE.md).
#
# Signature (facultative : sans certificat, les fichiers sont produits quand même, non signés) :
#   Windows : secrets WINDOWS_CERT_PFX (certificat .pfx en base64) et WINDOWS_CERT_PASSWORD
#   macOS   : secrets MACOS_CERT_P12 (base64), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
#             APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (notarisation)
#   Linux   : secrets GPG_PRIVATE_KEY (clé armurée) et GPG_KEY_ID
# Dépôt automatique sur le serveur (facultatif) : secrets YOMARA_SERVER (https://erp.yomaratechnologies.com)
#   et YOMARA_API_TOKEN (jeton d'un super administrateur) : les fichiers arrivent dans public/downloads
#   et la page « Télécharger » les propose aussitôt.
name: Applications (Windows, macOS, Linux)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Signer l'application (si certificat)
        if: env.HAS_CERT == 'true'
        env: { WINDOWS_CERT_PFX: '${{ secrets.WINDOWS_CERT_PFX }}', WINDOWS_CERT_PASSWORD: '${{ secrets.WINDOWS_CERT_PASSWORD }}' }
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 build\windows\x64\runner\Release\yomara_erp.exe
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows\yomara-erp.iss
          Compress-Archive -Path build\windows\x64\runner\Release\*, ..\LICENSE, ..\NOTICE.md -DestinationPath "dist\Yomara-ERP-windows-x64-v$env:APP_VERSION.zip"
      - name: Signer l'installateur (si certificat)
        if: env.HAS_CERT == 'true'
        env: { WINDOWS_CERT_PFX: '${{ secrets.WINDOWS_CERT_PFX }}', WINDOWS_CERT_PASSWORD: '${{ secrets.WINDOWS_CERT_PASSWORD }}' }
        shell: pwsh
        run: |
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\Yomara-ERP-Setup-v$env:APP_VERSION-x64.exe"
      - name: Paquet Microsoft Store (MSIX, identité dans pubspec.yaml › msix_config)
        shell: pwsh
        run: |
          $mv = "$env:APP_VERSION.0"
          dart run msix:create --store --build-windows false --version $mv --output-path dist --output-name "Yomara-ERP-$env:APP_VERSION-store"
      - name: Sommes de contrôle
        shell: pwsh
        run: |
          $lines = @(Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" })
          $lines | Out-File -Encoding ascii "dist\SHA256SUMS-windows-v$env:APP_VERSION.txt"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: app/dist/* }

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # CocoaPods comme sur le Mac de développement (Swift Package Manager : conflit firebase / google_sign_in)
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Certificat Apple (si fourni)
        if: env.HAS_CERT == 'true'
        env: { MACOS_CERT_P12: '${{ secrets.MACOS_CERT_P12 }}', MACOS_CERT_PASSWORD: '${{ secrets.MACOS_CERT_PASSWORD }}' }
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain && security default-keychain -s build.keychain && security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
      - name: Signature, DMG
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          packaging/macos/build.sh "$V" dist
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: app/dist/* }

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libfuse2
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build linux --release
      - name: appimagetool
        run: |
          curl -sSfL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Clé GPG (si fournie)
        if: env.HAS_GPG == 'true'
        env: { GPG_PRIVATE_KEY: '${{ secrets.GPG_PRIVATE_KEY }}' }
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Paquets .tar.gz, .deb, AppImage
        env: { GPG_KEY_ID: '${{ secrets.GPG_KEY_ID }}' }
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          packaging/linux/build.sh "$V" dist
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: app/dist/* }

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      HAS_SERVER: ${{ secrets.YOMARA_SERVER != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release GitHub (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/* }
      - name: Dépôt sur le serveur Yomara
        if: env.HAS_SERVER == 'true'
        env: { YOMARA_SERVER: '${{ secrets.YOMARA_SERVER }}', YOMARA_API_TOKEN: '${{ secrets.YOMARA_API_TOKEN }}' }
        run: |
          for f in dist/*; do
            name=$(basename "$f"); id=$(date +%s%N | sha1sum | cut -c1-24)
            split -b 8m -d "$f" "/tmp/part-$id-"
            parts=(/tmp/part-$id-*); total=${#parts[@]}; i=0
            for p in "${parts[@]}"; do
              curl -sSf -H "Authorization: Bearer $YOMARA_API_TOKEN" -H "Accept: application/json" \
                -F upload_id=$id -F index=$i -F total=$total -F name="$name" -F chunk=@"$p" \
                "$YOMARA_SERVER/api/admin/downloads" > /dev/null
              i=$((i+1))
            done
            echo "Déposé : $name"
          done
