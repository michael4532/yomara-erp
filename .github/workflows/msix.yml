# Yomara ERP — paquet Microsoft Store (MSIX) seul, en ~10 minutes.
# Lancement : onglet Actions › « Paquet Microsoft Store (MSIX) » › Run workflow,
# ou depuis un Mac / PC :  ./app/scripts/generer-msix.sh
# La version vient de pubspec.yaml (version: 1.0.1+3 → MSIX 1.0.1.0).
# L'identité Store (nom, éditeur) est dans pubspec.yaml › msix_config.
#
# Copyright © 2026 Yomara Technologies — licence AGPL-3.0 (voir LICENSE et NOTICE.md).
name: Paquet Microsoft Store (MSIX)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.0.2) — vide : celle de pubspec.yaml"
        required: false
        default: ""

jobs:
  msix:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Paquet MSIX pour le Microsoft Store
        shell: pwsh
        env:
          VERSION_DEMANDEE: ${{ github.event.inputs.version }}
        run: |
          $v = "$env:VERSION_DEMANDEE"
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value }
          New-Item -ItemType Directory -Force dist | Out-Null
          dart run msix:create --store --build-windows false --version "$v.0" --output-path dist --output-name "Yomara-ERP-$v-store"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with: { name: msix, path: app/dist/*.msix }
