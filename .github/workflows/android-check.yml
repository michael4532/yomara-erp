# Yomara ERP — contrôle de la compilation Android (APK release non signé), lancé à la demande.
# Ne publie rien et n'utilise aucun secret : vérifie seulement que Gradle et les plugins compilent.
#
# Copyright © 2026 Yomara Technologies — licence AGPL-3.0 (voir LICENSE et NOTICE.md).
name: Contrôle Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        # Même Flutter que les versions publiées (Shorebird : SB_FLUTTER dans app/scripts/shorebird-commun.sh)
        with: { flutter-version: '3.47.9', channel: stable, cache: true }
      - run: flutter pub get
      - name: Configuration Firebase factice (le vrai fichier reste sur le poste de publication)
        run: |
          cat > android/app/google-services.json <<'J'
          {"project_info":{"project_number":"0","project_id":"ci-placeholder"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.yomaratechnologies.yomaraerp"}},
                      "oauth_client":[],"api_key":[{"current_key":"ci-placeholder"}],"services":{}}],
           "configuration_version":"1"}
          J
      - name: APK release (non signé)
        env: { YOMARA_UNSIGNED: '1' }
        run: flutter build apk --release --no-tree-shake-icons
