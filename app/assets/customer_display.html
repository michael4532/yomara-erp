<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Écran client</title>
<!--MODE-->
<style>
  :root { --bg:#0b1b3a; --panel:#12264d; --line:#1f3766; --text:#f4f7fb; --muted:#9fb0cf; --accent:#ffc83d; --ok:#2fbf71; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:Roboto,"Segoe UI",system-ui,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; cursor:none; }
  .screen { position:absolute; inset:0; display:none; }
  .screen.on { display:flex; }
  header { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:14px; padding:22px 32px; }
  .logo { width:44px; height:44px; border-radius:12px; background:var(--accent); color:var(--bg); display:grid; place-items:center; font-weight:800; font-size:24px; }
  .company { font-weight:700; font-size:22px; }
  .clock { margin-left:auto; color:var(--muted); font-size:20px; font-variant-numeric:tabular-nums; }
  .offline { position:fixed; bottom:12px; right:16px; color:var(--muted); font-size:13px; display:none; }
  .offline.on { display:block; }

  /* Accueil */
  #idle { flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
  #idle h1 { font-size:clamp(40px,7vw,88px); font-weight:800; letter-spacing:-1px; }
  #idle p { color:var(--muted); font-size:clamp(18px,2.4vw,28px); }

  /* Panier */
  #cart { padding:96px 32px 32px; gap:28px; }
  .lines { flex:1.4; background:var(--panel); border-radius:22px; padding:12px 0; overflow:hidden; display:flex; flex-direction:column; }
  .lines-scroll { overflow:hidden; flex:1; scroll-behavior:smooth; }
  .ln { display:grid; grid-template-columns:1fr auto; gap:4px 18px; padding:14px 26px; border-bottom:1px solid var(--line); }
  .ln:last-child { border-bottom:0; }
  .ln .n { font-size:clamp(18px,2vw,26px); font-weight:600; }
  .ln .d { color:var(--muted); font-size:clamp(14px,1.4vw,18px); }
  .ln .t { font-size:clamp(18px,2vw,26px); font-weight:700; text-align:right; grid-row:span 2; align-self:center; font-variant-numeric:tabular-nums; }
  .ln.new { animation:flash 1.2s ease-out; }
  @keyframes flash { from { background:rgba(255,200,61,.22); } to { background:transparent; } }
  .sum { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; }
  .sum .count { color:var(--muted); font-size:clamp(18px,2vw,24px); }
  .sum .label { color:var(--muted); font-size:clamp(20px,2.2vw,28px); text-transform:uppercase; letter-spacing:2px; }
  .sum .total, .change .v { font-weight:800; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sum .total { font-size:clamp(48px,8vw,112px); }
  .unit { font-size:.42em; font-weight:700; margin-left:.18em; letter-spacing:0; }
  .sum .customer { font-size:clamp(16px,1.6vw,20px); color:var(--muted); }

  /* Paiement terminé */
  #paid { flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; }
  .check { width:120px; height:120px; border-radius:50%; background:var(--ok); display:grid; place-items:center; animation:pop .4s ease-out; }
  .check svg { width:64px; height:64px; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  #paid h1 { font-size:clamp(36px,6vw,72px); font-weight:800; }
  #paid .paidtotal { color:var(--muted); font-size:clamp(20px,2.4vw,30px); }
  .change { margin-top:12px; background:var(--panel); border-radius:22px; padding:22px 40px; }
  .change .label { color:var(--muted); font-size:clamp(16px,1.8vw,22px); text-transform:uppercase; letter-spacing:2px; }
  .change .v { font-size:clamp(44px,7vw,96px); }

  @media (orientation: portrait) {
    #cart { flex-direction:column; }
    .ln .n, .ln .t { font-size:clamp(18px,3.4vw,30px); }
    .ln .d { font-size:clamp(14px,2.4vw,20px); }
    .sum { flex:none; }
  }
</style>
</head>
<body>
<header><div class="logo" id="logo">Y</div><div class="company" id="company"></div><div class="clock" id="clock"></div></header>

<section class="screen on" id="idle">
  <h1 id="welcome">Bienvenue</h1>
  <p id="idlemsg">Votre caissier va vous servir</p>
</section>

<section class="screen" id="cart">
  <div class="lines"><div class="lines-scroll" id="lines"></div></div>
  <div class="sum">
    <div class="customer" id="customer"></div>
    <div class="count" id="count"></div>
    <div class="label">Total à payer</div>
    <div class="total" id="total"></div>
  </div>
</section>

<section class="screen" id="paid">
  <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <h1 id="thanks">Merci de votre visite !</h1>
  <div class="paidtotal" id="paidtotal"></div>
  <div class="change" id="changebox"><div class="label">Monnaie rendue</div><div class="v" id="change"></div></div>
</section>

<div class="offline" id="offline">Connexion à la caisse…</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var known = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // « 6 900 F CFA » : montant en grand, devise en petit, sur une seule ligne.
  function amount(el, txt) {
    var m = /^([-\d\s\u00a0\u202f.,]+?)\s*([^\d\s].*)?$/.exec(txt || '');
    el.innerHTML = m ? esc(m[1].trim()) + (m[2] ? '<span class="unit">' + esc(m[2]) + '</span>' : '') : esc(txt);
    fit(el);
  }
  // Réduit la taille si le montant déborde de son cadre.
  function fit(el) {
    el.style.fontSize = '';
    var max = el.parentElement.clientWidth, size = parseFloat(getComputedStyle(el).fontSize);
    el.style.display = 'inline-block';
    while (el.scrollWidth > max && size > 24) { size -= 4; el.style.fontSize = size + 'px'; }
    el.style.display = '';
  }
  function show(id) { ['idle','cart','paid'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); }

  function render(st) {
    if (!st) return;
    $('company').textContent = st.company || '';
    $('logo').textContent = (st.company || 'Y').trim().charAt(0).toUpperCase() || 'Y';
    if (st.welcome) $('welcome').textContent = st.welcome;
    if (st.footer) $('thanks').textContent = st.footer;
    if (st.status === 'cart' && st.lines && st.lines.length) {
      var html = '', next = {};
      st.lines.forEach(function (l) {
        var key = l.key + '|' + l.qty;
        next[key] = 1;
        html += '<div class="ln' + (known[key] ? '' : ' new') + '"><div class="n">' + esc(l.name) + '</div><div class="t">' + esc(l.total) + '</div><div class="d">' + esc(l.detail) + '</div></div>';
      });
      known = next;
      $('lines').innerHTML = html;
      $('lines').scrollTop = $('lines').scrollHeight; // dernier article toujours visible
      amount($('total'), st.total);
      $('count').textContent = st.count || '';
      $('customer').textContent = st.customer ? 'Client : ' + st.customer : '';
      show('cart');
    } else if (st.status === 'paid') {
      known = {};
      $('paidtotal').textContent = st.total ? 'Payé : ' + st.total : '';
      $('changebox').style.display = st.change ? '' : 'none';
      show('paid');
      amount($('change'), st.change || '');
    } else {
      known = {};
      show('idle');
    }
  }

  function tick() {
    var d = new Date();
    $('clock').textContent = d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }) + ' · ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }
  tick(); setInterval(tick, 10000);
  window.addEventListener('resize', function () { ['total','change'].forEach(function (id) { if ($(id).offsetParent) fit($(id)); }); });

  if (window.YD_MODE === 'sse' && window.EventSource) {
    // Servi par l'application de caisse sur le réseau local
    var es = new EventSource('events');
    es.onopen = function () { $('offline').classList.remove('on'); };
    es.onerror = function () { $('offline').classList.add('on'); };
    es.onmessage = function (e) { try { render(JSON.parse(e.data)); } catch (_) {} };
  } else if (window.BroadcastChannel) {
    // Seconde fenêtre du navigateur, ouverte depuis la caisse Web
    var ch = new BroadcastChannel('yomara-customer-display');
    ch.onmessage = function (e) { $('offline').classList.remove('on'); try { render(typeof e.data === 'string' ? JSON.parse(e.data) : e.data); } catch (_) {} };
    $('offline').classList.add('on');
    ch.postMessage('hello');
    setInterval(function () { ch.postMessage('hello'); }, 5000);
  }
})();
</script>
</body>
</html>
